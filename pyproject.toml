[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coords2img"
version = "0.1.0"
description = "Generate static map images (PNG or terminal sixel) from coordinates, with JSON-driven markers, lines, and paths."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Florent de Lamotte", email = "florent@frizoncorrea.fr" },
]
keywords = ["map", "tiles", "sixel", "cli", "gis", "cartography", "openstreetmap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=9.0",
    "requests>=2.25",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/fdlamotte/coords2img"
Repository = "https://github.com/fdlamotte/coords2img"
Issues = "https://github.com/fdlamotte/coords2img/issues"
Changelog = "https://github.com/fdlamotte/coords2img/blob/main/CHANGELOG.md"

[project.scripts]
coords2img = "coords2img.coords2img:main"

# coords2img.py stays a single, standalone-runnable file -- it just lives
# inside src/coords2img/ alongside a thin __init__.py (library re-exports)
# and __main__.py (`python -m coords2img`).
[tool.hatch.build.targets.wheel]
packages = ["src/coords2img"]
